<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">
  <title>Troop Ratio｜設定</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="settings">
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">Whiteout Survival</p>
        <h1>Troop Ratio</h1>
        <p class="subtitle">出征配置計算器</p>
      </div>
      <div class="player-box">
        <span>玩家</span>
        <strong id="playerDisplay">心碎小狗</strong>
      </div>
    </header>

    <section class="page-title">
      <p class="kicker">Settings</p>
      <h2>設定</h2>
      <p>所有資料只需在這裡輸入一次，打熊與 CJ 頁面會直接讀取。</p>
    </section>

    <section class="card">
      <div class="section-head"><h3>基本資料</h3></div>
      <div class="input-grid">
        <label>玩家名稱<input id="playerName" type="text" value="心碎小狗"></label>
        <label>有英雄出征容量<input id="withHeroesCap" type="number" value="147810" min="0"></label>
        <label>無英雄出征容量<input id="withoutHeroesCap" type="number" value="107400" min="0"></label>
        <label>Cyrille 容量加成<input id="cyrilleBonus" type="number" value="0" min="0"></label>
        <label>Pet Skill 容量加成<input id="petBonus" type="number" value="0" min="0"></label>
        <label>Joiner 單隊上限<input id="joinerLimit" type="number" value="97000" min="0"></label>
        <label>Joiner 數量<input id="joinerCount" type="number" value="5" min="1" max="6"></label>
        <label>無英雄 Joiner 數量<input id="heroLessJoinerCount" type="number" value="1" min="0" max="6"></label>
      </div>
    </section>

    <section class="card">
      <div class="section-head">
        <h3>總兵力</h3>
        <div id="totalTroops" class="metric-pill"></div>
      </div>
      <div class="input-grid three">
        <label>盾兵 Infantry<input id="infantry" type="number" value="278686" min="0"></label>
        <label>矛兵 Lancer<input id="lancer" type="number" value="230332" min="0"></label>
        <label>射手 Marksman<input id="marksman" type="number" value="314377" min="0"></label>
      </div>
      <div id="totalChart" class="chart-card"></div>
    </section>

    <section class="card">
      <div class="section-head"><h3>主隊比例</h3></div>
      <div class="input-grid three">
        <label>盾兵比例 %<input id="mainInfRatio" type="number" value="50" min="0" max="100"></label>
        <label>矛兵比例 %<input id="mainLanRatio" type="number" value="20" min="0" max="100"></label>
        <label>射手比例 %<input id="mainMarRatio" type="number" value="30" min="0" max="100"></label>
      </div>
      <div id="mainRatioWarning" class="warning"></div>
      <div id="mainResult"></div>
    </section>

    <section class="card">
      <div class="section-head"><h3>打熊 Joiner</h3></div>
      <div class="input-grid two compact">
        <label>Joiner 盾兵比例 %<input id="joinerInfRatio" type="number" value="10" min="0" max="100"></label>
      </div>
    </section>

    <section class="card actions">
      <button id="saveBtn">儲存設定</button>
      <button id="resetBtn" class="secondary">恢復預設值</button>
    </section>
  </main>

  <nav class="bottom-nav">
    <a href="index.html" class="active"><span>設定</span></a>
    <a href="bear.html"><span>打熊</span></a>
    <a href="cj.html"><span>CJ</span></a>
  </nav>

  <script src="app.js"></script>
</body>
</html>
