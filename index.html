<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>Whiteout Survival Troop Ratio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">Whiteout Survival</p>
        <h1>Troop Ratio</h1>
        <p class="subtitle">打熊與 CJ 出征配置計算器</p>
      </div>
      <div class="player-box">
        <span>玩家</span>
        <strong id="playerDisplay">心碎小狗</strong>
      </div>
    </header>

    <nav class="tabs" aria-label="主選單">
      <button class="tab-btn active" data-tab="settings">設定</button>
      <button class="tab-btn" data-tab="bear">打熊</button>
      <button class="tab-btn" data-tab="cj">CJ</button>
    </nav>

    <section id="tab-settings" class="tab-page active">
      <section class="card">
        <div class="section-head">
          <div>
            <p class="kicker">Profile</p>
            <h2>基本資料</h2>
          </div>
        </div>
        <div class="input-grid">
          <label>
            玩家名稱
            <input id="playerName" type="text" value="心碎小狗" />
          </label>
          <label>
            有英雄出征容量
            <input id="withHeroesCap" type="number" value="147810" min="0" />
          </label>
          <label>
            無英雄出征容量
            <input id="withoutHeroesCap" type="number" value="107400" min="0" />
          </label>
          <label>
            Cyrille 容量加成
            <input id="cyrilleBonus" type="number" value="0" min="0" />
          </label>
          <label>
            Pet Skill 容量加成
            <input id="petBonus" type="number" value="0" min="0" />
          </label>
          <label>
            Joiner 單隊上限
            <input id="joinerLimit" type="number" value="97000" min="0" />
          </label>
          <label>
            Joiner 數量
            <input id="joinerCount" type="number" value="5" min="1" max="6" />
          </label>
          <label>
            無英雄 Joiner 數量
            <input id="heroLessJoinerCount" type="number" value="1" min="0" max="6" />
          </label>
        </div>
      </section>

      <section class="card">
        <div class="section-head">
          <div>
            <p class="kicker">Troops</p>
            <h2>總兵力</h2>
          </div>
          <div id="totalTroops" class="metric-pill"></div>
        </div>
        <div class="input-grid three">
          <label>
            盾兵 Infantry
            <input id="infantry" type="number" value="278686" min="0" />
          </label>
          <label>
            矛兵 Lancer
            <input id="lancer" type="number" value="230332" min="0" />
          </label>
          <label>
            射手 Marksman
            <input id="marksman" type="number" value="314377" min="0" />
          </label>
        </div>
        <div id="totalChart" class="chart-card"></div>
      </section>

      <section class="card">
        <div class="section-head">
          <div>
            <p class="kicker">Main march</p>
            <h2>主隊比例</h2>
          </div>
        </div>
        <div class="input-grid three">
          <label>
            盾兵比例 %
            <input id="mainInfRatio" type="number" value="50" min="0" max="100" />
          </label>
          <label>
            矛兵比例 %
            <input id="mainLanRatio" type="number" value="20" min="0" max="100" />
          </label>
          <label>
            射手比例 %
            <input id="mainMarRatio" type="number" value="30" min="0" max="100" />
          </label>
        </div>
        <div id="mainRatioWarning" class="warning"></div>
        <div id="mainResult"></div>
      </section>

      <section class="card actions">
        <button id="saveBtn">儲存到瀏覽器</button>
        <button id="resetBtn" class="secondary">恢復預設值</button>
      </section>
    </section>

    <section id="tab-bear" class="tab-page">
      <section class="card">
        <div class="section-head">
          <div>
            <p class="kicker">Bear Trap</p>
            <h2>打熊配置</h2>
          </div>
          <span class="metric-pill">Quantity Limit</span>
        </div>

        <div class="input-grid two compact">
          <label>
            Joiner 盾兵比例 %
            <input id="joinerInfRatio" type="number" value="10" min="0" max="100" />
          </label>
        </div>

        <p class="hint">主隊先使用兵力；剩餘射手平均分配給 Joiner；每隊先放指定盾兵，再以矛兵補滿單隊上限。</p>

        <div id="bearSummary" class="summary-grid"></div>
        <div id="bearChart" class="chart-list"></div>
        <div id="bearResult"></div>

        <div class="subsection">
          <h3>剩餘可分配兵力</h3>
          <div id="bearRemaining"></div>
        </div>
      </section>
    </section>

    <section id="tab-cj" class="tab-page">
      <section class="card">
        <div class="section-head">
          <div>
            <p class="kicker">CJ Distribution</p>
            <h2>CJ 1～CJ 6</h2>
          </div>
          <span class="metric-pill">原 Excel 邏輯</span>
        </div>

        <p class="hint">三種兵各自 ÷ 6，依序以「盾 → 矛 → 射」填入單隊容量。</p>

        <div id="cjSummary" class="summary-grid"></div>
        <div id="cjChart" class="chart-list"></div>
        <div id="cjResult"></div>

        <div class="subsection">
          <h3>剩餘可分配兵力</h3>
          <div id="cjRemaining"></div>
        </div>
      </section>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
